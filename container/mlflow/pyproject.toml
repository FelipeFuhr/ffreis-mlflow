[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlflow-server"
version = "0.1.0"
description = "MLflow tracking and artifacts server"
requires-python = ">=3.12"
dependencies = [
    "mlflow>=2.15.0",
    "psycopg2-binary>=2.9.9",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = []
