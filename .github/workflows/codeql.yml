name: Code Scanning (CodeQL)

on:
  schedule:
    - cron: "0 3 * * 0" # Sundays 03:00 UTC

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-codeql.yml@main
    with:
      languages: "python"
      source-root: "."
