name: Code Scanning (CodeQL)

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "10 0 14 * *"  # monthly scattered (was: 0 3 * * 0)


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-codeql.yml@main
    with:
      languages: "python"
      source-root: "."
