name: Container Scan (Trivy)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "container/mlflow/**"
      - "Makefile"
      - ".github/workflows/trivy.yml"
  push:
    branches: [main]
    paths:
      - "container/mlflow/**"
      - "Makefile"
      - ".github/workflows/trivy.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    uses: FelipeFuhr/ffreis-workflows-container/.github/workflows/container-scan-trivy.yml@main
    with:
      image-name: "mlflow:ci"
      containerfile: "container/mlflow/Containerfile"
      context: "container/mlflow"
      severity: "HIGH,CRITICAL"
