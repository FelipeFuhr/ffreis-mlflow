name: Container Scan (Grype)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "container/mlflow/**"
      - "Makefile"
      - ".github/workflows/grype.yml"
  push:
    branches: [main]
    paths:
      - "container/mlflow/**"
      - "Makefile"
      - ".github/workflows/grype.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  grype:
    timeout-minutes: 30
    uses: FelipeFuhr/ffreis-workflows-container/.github/workflows/container-scan-grype.yml@main
    with:
      image-name: "mlflow:ci"
      containerfile: "container/mlflow/Containerfile"
      context: "container/mlflow"
      severity: "high"
      build-args: ""
      # Upload is handled by the reusable workflow (SARIF upload gated on forks)
